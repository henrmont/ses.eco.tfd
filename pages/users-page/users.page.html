<section>
  <div class="table">
    <div class="search">
      <mat-form-field appearance="outline">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Buscar usuário" #userInput>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    
    <table mat-table [dataSource]="dataSource" matSort #userSort="matSort">
      
      <!-- Coluna Trava -->
      <ng-container matColumnDef="is_editable">
        <th mat-header-cell *matHeaderCellDef class="center"></th>
        <td mat-cell *matCellDef="let element" class="center">
          <button mat-icon-button 
                  type="button"
                  [matTooltip]="element.module?.pivot?.is_editable ? 'Travar usuário' : 'Destravar usuário'" 
                  (click)="userLock(element)" 
                  [disabled]="checkPermissions('tfd/usuário travar')">
            <mat-icon>{{ element.module?.pivot?.is_editable ? 'lock_open' : 'lock' }}</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Coluna Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
      </ng-container>
    
      <!-- Coluna Nome -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
        <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
      </ng-container>

      <!-- Coluna Tipo -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
        <td mat-cell *matCellDef="let element"> {{ element.type }} </td>
      </ng-container>
    
      <!-- Coluna Ativo / Validação -->
      <ng-container matColumnDef="is_valid">
        <th mat-header-cell *matHeaderCellDef class="center"> Ativo </th>
        <td mat-cell *matCellDef="let element" class="center">
          <button mat-icon-button 
                  type="button"
                  [matTooltip]="element.module?.pivot?.is_valid ? 'Invalidar usuário' : 'Validar usuário'" 
                  (click)="userValidate(element)" 
                  [disabled]="element.is_editable || checkPermissions('tfd/usuário validar')">
            <mat-icon [className]="element.module?.pivot?.is_valid ? 'valid' : 'invalid'">
              {{ element.module?.pivot?.is_valid ? 'check' : 'close' }}
            </mat-icon>
          </button>
        </td>
      </ng-container>
    
      <!-- Coluna Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="center"> Ações </th>
        <td mat-cell *matCellDef="let element" class="center actions-cell">
          <button mat-icon-button 
                  type="button" 
                  matTooltip="Detalhes do usuário" 
                  (click)="userDetail(element)" 
                  [disabled]="element.is_editable">
            <mat-icon>visibility</mat-icon>
          </button>
          
          <button mat-icon-button 
                  type="button" 
                  matTooltip="Regras do usuário" 
                  (click)="userRoles(element)" 
                  [disabled]="element.is_editable || checkPermissions('tfd/usuário atualizar')">
            <mat-icon>rule</mat-icon>
          </button>
          
          <button mat-icon-button 
                  type="button" 
                  matTooltip="Atualizar usuário" 
                  (click)="userUpdate(element)" 
                  [disabled]="element.is_editable || checkPermissions('tfd/usuário atualizar')">
            <mat-icon>drive_file_rename_outline</mat-icon>
          </button>
          
          <button mat-icon-button 
                  type="button" 
                  matTooltip="Deletar usuário" 
                  (click)="userDelete(element)" 
                  [disabled]="element.is_editable || checkPermissions('tfd/usuário deletar')">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell center" [attr.colspan]="displayedColumns.length">
          <p>Nenhum resultado encontrado.</p>
        </td>
      </tr>
    </table>

    <mat-paginator 
      #userPaginator 
      [pageSize]="8"
      hidePageSize="true">
    </mat-paginator>
  </div>
</section>
