<section>
  <div class="table">
    <div class="search">
      <mat-form-field appearance="outline">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Buscar solicitação arquivada" #archiveInput>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    
    <table mat-table [dataSource]="archivedDataSource" matSort #archiveSort="matSort">
      
      <!-- Nome / Paciente -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Paciente </th>
        <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
      </ng-container>

      <!-- CNS -->
      <ng-container matColumnDef="cns">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> CNS </th>
        <td mat-cell *matCellDef="let element"> 
          {{ element.cns !== '-' ? (element.cns | mask: '000 0000 0000 0000') : '-' }} 
        </td>
      </ng-container>

      <!-- Documento -->
      <ng-container matColumnDef="document">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Documento </th>
        <td mat-cell *matCellDef="let element"> 
          {{ element.document !== '-' ? (element.document | mask: '000.000.000-00') : '-' }} 
        </td>
      </ng-container>

      <!-- Responsável -->
      <ng-container matColumnDef="responsible">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Responsável </th>
        <td mat-cell *matCellDef="let element"> {{ element.responsible }} </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="center"> Status </th>
        <td mat-cell *matCellDef="let element" class="center">
          <button mat-icon-button type="button" disabled>
            <mat-icon class="valid">check</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <!-- Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="center"> Ações </th>
        <td mat-cell *matCellDef="let element" class="center actions-cell">
          <button mat-icon-button 
                  type="button" 
                  matTooltip="Detalhes da solicitação" 
                  (click)="patientRequestDetail(element)">
            <mat-icon>visibility</mat-icon>
          </button>

          <button mat-icon-button 
                  type="button" 
                  matTooltip="Mover para minha caixa" 
                  (click)="patientRequestMoveFromArchive(element)" 
                  [disabled]="checkPermissions('tfd/parecer atualizar')">
            <mat-icon>unarchive</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell center" [attr.colspan]="displayedColumns.length">
          <p>Nenhum resultado encontrado.</p>
        </td>
      </tr>
    </table>

    <mat-paginator 
      #archivePaginator 
      [pageSize]="8"
      hidePageSize="true">
    </mat-paginator>
  </div>
</section>
