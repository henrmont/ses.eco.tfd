<section>
    <div class="table">
        <div class="search">
            <mat-form-field appearance="outline">
                <mat-label>Buscar</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Buscar solicitação arquivada" #archiveInput>
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>
        
        <table mat-table [dataSource]="archivedDataSource" matSort #archiveSort="matSort">
            
            <!-- Coluna Nome -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
                <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
            </ng-container>

            <!-- Coluna CNS -->
            <ng-container matColumnDef="cns">
                <th mat-header-cell *matHeaderCellDef> CNS </th>
                <td mat-cell *matCellDef="let element"> {{ element.cns | mask:'000 0000 0000 0000' }} </td>
            </ng-container>

            <!-- Coluna Tipo -->
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
                <td mat-cell *matCellDef="let element"> {{ element.type }} </td>
            </ng-container>

            <!-- Coluna Responsável -->
            <ng-container matColumnDef="responsible">
                <th mat-header-cell *matHeaderCellDef> Responsável </th>
                <td mat-cell *matCellDef="let element"> {{ element.responsible }} </td>
            </ng-container>
        
            <!-- Coluna Ações -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="center actions-column-header-others"> Ações </th>
                <td mat-cell *matCellDef="let element" class="center actions-cell">
                    <button mat-icon-button 
                            type="button" 
                            matTooltip="Detalhes da solicitação" 
                            (click)="showPatientRequest(element)">
                        <mat-icon>visibility</mat-icon>
                    </button>

                    <button mat-icon-button 
                            type="button" 
                            matTooltip="Mover para minha caixa" 
                            (click)="movePatientRequestFromArchive(element)" 
                            [disabled]="checkPermissions('tfd/ajuda de custo atualizar')">
                        <mat-icon>move_to_inbox</mat-icon>
                    </button>
                </td>
            </ng-container>
        
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell center" [attr.colspan]="displayedColumns.length">
                    <p>Nenhum resultado encontrado.</p>
                </td>
            </tr>
        </table>

        <mat-paginator 
            #archivePaginator 
            [pageSize]="8"
            hidePageSize="true">
        </mat-paginator>
    </div>
</section>
