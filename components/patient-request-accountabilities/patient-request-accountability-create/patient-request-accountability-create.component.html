<h2 mat-dialog-title>Nova prestação de contas</h2>

<form [formGroup]="createAccountabilityForm">
  <mat-dialog-content>
    <div class="stepper">

      <!-- Linha 1: Nome -->
      <div class="line cols-1-col">
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input 
            matInput 
            type="text" 
            formControlName="name" 
            placeholder="Nome da prestação de contas"
          >

          @for (item of errorMessages['name']; track $index) {
            <mat-error [hidden]="!createAccountabilityForm.get('name')?.hasError(item.type)">
              {{ item.message }}
            </mat-error>
          }
        </mat-form-field>
      </div>

    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="isSubmitting()" [mat-dialog-close]="false">
      Cancelar
    </button>
    
    <button 
      mat-flat-button 
      color="primary" 
      type="button" 
      [disabled]="createAccountabilityForm.invalid || createAccountabilityForm.pending || isSubmitting()"
      (click)="onSubmit()"
    >
      <div class="waiting">
        @if (isSubmitting()) {
          <mat-spinner [diameter]="20"></mat-spinner>
        }
        <span>{{ isSubmitting() ? 'Criando...' : 'Criar' }}</span>
      </div>
    </button>
  </mat-dialog-actions>
</form>
