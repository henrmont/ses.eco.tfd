<h2 mat-dialog-title>Nova prestação de contas</h2>

<mat-dialog-content>
  <form [formGroup]="createAccountabilityForm">
    <div class="stepper">

      <!-- Linha 1: Nome -->
      <div class="line cols-1-col">
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input 
            matInput 
            type="text" 
            formControlName="name" 
            placeholder="Nome da prestação de contas"
          >

          @for (item of errorMessages['name']; track $index) {
            <mat-error [hidden]="!createAccountabilityForm.get('name')?.hasError(item.type)">
              {{ item.message }}
            </mat-error>
          }
        </mat-form-field>
      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button 
    mat-button 
    type="button" 
    [mat-dialog-close]="false" 
    [disabled]="isSubmitting()"
  >
    Fechar
  </button>

  <button 
    mat-flat-button 
    color="primary" 
    type="button" 
    [disabled]="createAccountabilityForm.invalid || isSubmitting()"
    (click)="onSubmit()"
  >
    <div class="waiting">
      @if (isSubmitting()) {
        <mat-spinner [diameter]="20"></mat-spinner>
      }
      Criar
    </div>
  </button>
</mat-dialog-actions>
