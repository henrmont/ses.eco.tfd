<h2 mat-dialog-title>Deletar regra</h2>

<mat-dialog-content>
  <p class="confirmation-text">
    Você deseja realmente deletar a regra <strong>{{ formatRoleName(data?.role?.name) }}</strong>?<br> 
  </p>
  <p class="warning-text">Esta ação não poderá ser desfeita.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false" [disabled]="isSubmitting()">
    Cancelar
  </button>
  
  <button 
    mat-flat-button 
    color="warn" 
    type="button" 
    [disabled]="isSubmitting()" 
    (click)="onSubmit()">
    <div class="waiting">
      @if (isSubmitting()) {
        <mat-spinner diameter="20"></mat-spinner>
      }
      <span>{{ isSubmitting() ? 'Excluindo...' : 'Confirmar Exclusão' }}</span>
    </div>
  </button>
</mat-dialog-actions>
