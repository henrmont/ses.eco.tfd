<h2 mat-dialog-title>Retornar solicitação</h2>

<form [formGroup]="undoForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="stepper">
      <div class="line cols-1-col">
        <!-- Seleção de Destino -->
        <mat-form-field appearance="outline">
          <mat-label>Para</mat-label>
          <mat-select formControlName="to">
            @for (option of destinationOptions(); track option.value) {
              <mat-option [value]="option.value">
                {{ option.label }}
              </mat-option>
            }
          </mat-select>

          @for (item of errorMessages['to']; track $index) {
            <mat-error [hidden]="!undoForm.get('to')?.hasError(item.type)">
              {{ item.message }}
            </mat-error>
          }
        </mat-form-field>

        <!-- Motivo / Justificativa -->
        <mat-form-field appearance="outline">
          <mat-label>Motivo</mat-label>
          <textarea 
            matInput 
            rows="4" 
            formControlName="reason">
          </textarea>

          @for (item of errorMessages['reason']; track $index) {
            <mat-error [hidden]="!undoForm.get('reason')?.hasError(item.type)">
              {{ item.message }}
            </mat-error>
          }
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button 
      mat-button 
      type="button" 
      [mat-dialog-close]="false" 
      [disabled]="isSubmitting()">
      Cancelar
    </button>

    <button 
      mat-flat-button
      color="primary"
      type="submit" 
      [disabled]="undoForm.invalid || isSubmitting()">
      <div class="waiting">
        @if (isSubmitting()) {
          <mat-spinner [diameter]="20"></mat-spinner>
        }
        <span>{{ isSubmitting() ? 'Retornando...' : 'Retornar' }}</span>
      </div>
    </button>
  </mat-dialog-actions>
</form>
