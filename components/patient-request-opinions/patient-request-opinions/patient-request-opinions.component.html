<h2 mat-dialog-title>Lista de pareceres</h2>

<mat-dialog-content>
  <div class="opinions-container">

    @if (isLoading()) {
      <div class="loading-shade">
        <mat-spinner [diameter]="40"></mat-spinner>
      </div>
    } @else {
      <div class="table">
        <table mat-table [dataSource]="dataSource">
            
          <!-- Nome -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
          </ng-container>

          <!-- Profissional -->
          <ng-container matColumnDef="owner">
            <th mat-header-cell *matHeaderCellDef> Profissional </th>
            <td mat-cell *matCellDef="let element"> {{ element.professional?.name ?? 'Não informado' }} </td>
          </ng-container>

          <!-- Status -->
          <ng-container matColumnDef="is_approved">
            <th mat-header-cell *matHeaderCellDef class="center"> Status </th>
            <td mat-cell *matCellDef="let element" class="center">
              <button mat-icon-button type="button" disabled>
                <mat-icon [className]="element.is_approved ? 'valid' : 'invalid'">
                  {{ element.is_approved ? 'check' : 'priority_high' }}
                </mat-icon>
              </button>
            </td>
          </ng-container>

          <!-- Ações -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="center"> Ações </th>
            <td mat-cell *matCellDef="let element" class="center actions-cell">
              <button 
                mat-icon-button 
                type="button" 
                matTooltip="Detalhes do parecer" 
                (click)="opinionDetail(element)">
                <mat-icon>visibility</mat-icon>
              </button>

              <button 
                mat-icon-button 
                type="button" 
                matTooltip="Atualizar parecer" 
                [disabled]="checkPermissions('tfd/parecer atualizar') || !element.my_opinion"
                (click)="opinionUpdate(element)">
                <mat-icon>drive_file_rename_outline</mat-icon>
              </button>

              <button 
                mat-icon-button 
                type="button" 
                matTooltip="Deletar parecer" 
                [disabled]="checkPermissions('tfd/parecer deletar') || !element.my_opinion"
                (click)="opinionDelete(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
          <!-- Estado Vazio -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell center" [attr.colspan]="displayedColumns.length">
              <p>Nenhum parecer cadastrado para esta solicitação.</p>
            </td>
          </tr>
        </table>
      </div>
    }

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Fechar</button>
  <button 
    mat-flat-button 
    color="primary" 
    type="button" 
    [disabled]="checkPermissions('tfd/parecer criar') || isLoading()" 
    (click)="opinionCreate()">
    <mat-icon>add</mat-icon>
    Novo parecer
  </button>
</mat-dialog-actions>
