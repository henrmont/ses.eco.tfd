<h2 mat-dialog-title>Requisitos da Solicitação</h2>

<mat-dialog-content>
  @if (requirements().length > 0) {
    <mat-list>
      @for (item of requirements(); track item.label) {
        <mat-list-item [class.fulfilled]="item.fulfilled" [class.unfulfilled]="!item.fulfilled">
          <mat-icon matListItemIcon>
            {{ item.fulfilled ? 'check_circle' : 'cancel' }}
          </mat-icon>
          <div matListItemTitle class="requirement-title">
            {{ item.label }}
          </div>
        </mat-list-item>
      }
    </mat-list>
  } @else {
    <div class="empty-state">
      <p>Nenhum dado da solicitação disponível para validação.</p>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Fechar</button>
</mat-dialog-actions>
