<h2 mat-dialog-title>Atualizar anexo da solicitação</h2>

<mat-dialog-content>
  <form [formGroup]="attachmentForm">
    <div class="stepper">
      
      <!-- Linha 1: Nome do Anexo -->
      <div class="line cols-1-col">
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput type="text" formControlName="name">
          @for (item of errorMessages['name']; track $index) {
            <mat-error [hidden]="!attachmentForm.get('name')?.hasError(item.type)">
              {{ item.message }}
            </mat-error>
          }
        </mat-form-field>
      </div>

      <!-- Linha 2: Ações de Arquivo (Download e Anexo) -->
      <div class="line cols-1-col">
        <div class="file-actions-cell">
          <button 
            class="btn-archive" 
            type="button" 
            mat-icon-button 
            [disabled]="!data?.patient_request_attachment?.archive_id || isSubmitting()" 
            (click)="download(data?.patient_request_attachment?.archive_id, attachmentForm.get('name')?.value)"
            matTooltip="Baixar arquivo atual">
            <mat-icon>download</mat-icon>
          </button>

          <input 
            type="file" 
            hidden 
            (change)="onFileSelected($event)" 
            #fileInput 
            [disabled]="isSubmitting()">

          <button 
            mat-raised-button 
            type="button" 
            [class.attached]="attachmentFile.file !== null"
            (click)="fileInput.click()" 
            [matTooltip]="attachmentFile.label()" 
            [disabled]="isSubmitting()">
            <mat-icon>attach_file</mat-icon>
            Anexar arquivo
          </button>
        </div>
      </div>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false" [disabled]="isSubmitting()">Fechar</button>
  <button 
    mat-flat-button 
    color="primary" 
    type="button" 
    [disabled]="attachmentForm.invalid || attachmentForm.pending || isFormsPristine() || isSubmitting()" 
    (click)="onSubmit()">
    <div class="waiting">
      @if (isSubmitting()) {
        <mat-spinner [diameter]="20"></mat-spinner>
      }
      Salvar alterações
    </div>
  </button>
</mat-dialog-actions>
