<h2 mat-dialog-title>Arquivos do laudo</h2>

<mat-dialog-content>
  <div class="attachments-container">

    @if (isLoading()) {
      <div class="loading-shade">
        <mat-spinner [diameter]="40"></mat-spinner>
      </div>
    } @else {
      <div class="table">
        <table mat-table [dataSource]="dataSource">
            
          <!-- Nome -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let element">
              {{ element.name }}
            </td>
          </ng-container>

          <!-- Ações -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="center"> Ações </th>
            <td mat-cell *matCellDef="let element" class="center actions-cell">
              <button 
                mat-icon-button 
                type="button" 
                matTooltip="Download do arquivo" 
                (click)="download(element.archive_id, element.name)">
                <mat-icon color="primary">download</mat-icon>
              </button>

              <button 
                mat-icon-button 
                type="button" 
                matTooltip="Atualizar arquivo" 
                (click)="reportAttachmentUpdate(element)">
                <mat-icon>drive_file_rename_outline</mat-icon>
              </button>

              <button 
                mat-icon-button 
                type="button" 
                matTooltip="Deletar arquivo" 
                (click)="reportAttachmentDelete(element)">
                <mat-icon color="warn">delete</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
          <!-- Estado Vazio -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell center" [attr.colspan]="displayedColumns.length">
              <p>Nenhum arquivo encontrado para este laudo.</p>
            </td>
          </tr>
        </table>
      </div>
    }

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Fechar</button>
  <button 
    mat-flat-button 
    color="primary" 
    type="button" 
    (click)="reportAttachmentCreate()">
    <mat-icon>add</mat-icon>
    Novo arquivo
  </button>
</mat-dialog-actions>
