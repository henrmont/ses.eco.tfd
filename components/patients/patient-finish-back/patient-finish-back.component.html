<h2 mat-dialog-title>Retornou para você</h2>

<mat-dialog-content>
  <p>
    <strong>{{ backToUser }}</strong>
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button 
    mat-button 
    type="button" 
    [mat-dialog-close]="false" 
    [disabled]="isSubmitting()">
    Cancelar
  </button>

  <button 
    mat-flat-button 
    color="primary" 
    type="button" 
    [disabled]="isSubmitting()" 
    (click)="onSubmit()">
    <div class="waiting">
      @if (isSubmitting()) {
        <mat-spinner [diameter]="20"></mat-spinner>
      }
      <span>{{ isSubmitting() ? 'Finalizando...' : 'Finalizar' }}</span>
    </div>
  </button>
</mat-dialog-actions>
